
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - run: pip install -e '.[dev,intel]'
      - run: ruff check .
      - run: pytest -q

  api:
    name: API (Node)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npm test
      - run: npm run build

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Full-stack e2e
    runs-on: ubuntu-latest
    needs: [agent, api, web]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: sudo apt-get update && sudo apt-get install -y redis-server

      - run: python -m venv ai-service/.venv && ai-service/.venv/bin/pip install -e ai-service

      - run: npm ci
        working-directory: server

      - run: node scripts/e2e.mjs

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [agent, api, web]

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t devforge-agent ai-service
      - run: docker build -t devforge-api server
      - run: docker build -t devforge-web client