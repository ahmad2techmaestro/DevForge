[project]
name = "devforge-agent"
version = "0.1.0"
description = "DevForge agent service: repo intelligence + LangGraph run pipeline"
license = { text = "MIT" }
authors = [{ name = "Shah Ahmad Raza" }]
requires-python = ">=3.12"
dependencies = [
"fastapi>=0.115",
"uvicorn>=0.30",
"pydantic>=2.7",
"httpx>=0.27",
"langgraph>=1.0",
"langgraph-checkpoint-sqlite>=3.0",
"langchain-core>=1.0",
"langchain-anthropic>=1.0",
"langchain-openai>=1.0",
"google-genai>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
intel = ["tree-sitter>=0.23", "tree-sitter-python>=0.23", "tree-sitter-javascript>=0.23", "tree-sitter-typescript>=0.23", "tree-sitter-go>=0.23", "tree-sitter-java>=0.23"]
trace = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "SIM905"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]
